# =============================================================================
# nginx de la API de OpticaHefesto.
# =============================================================================
#
# SOLO ESCUCHA DENTRO DE LA RED DE COMPOSE
# ----------------------------------------
# nginx corre en el puerto 8000 del contenedor y NO se publica al host. Lo unico
# que publica puertos al exterior es el proxy (deploy/caddy/Caddyfile). Asi
# PostgreSQL, Redis, la API y el worker no tienen forma de ser alcanzados desde
# fuera. Ver docs/04.
#
# `server_tokens off` no dice nada sobre que corre nginx. En una aplicacion que
# maneja recetas, la version del servidor no es informacion que se difunda.
# =============================================================================

user  www-data;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # El log va a stderr, que es lo que lee `docker logs`. Escribir a un
    # archivo dentro del contenedor es una forma de que el registro se pierda
    # en el proximo despliegue sin que nadie lo note.
    access_log  /dev/stdout;
    error_log   /dev/stderr  warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    server_tokens off;

    # El limite de cuerpo va bajo a proposito: una optica no sube archivos por
    # la interfaz. No hay radiografias ni documentos en esta version, y no se
    # abre la puerta a que empiecen a subir sin que alguien lo decida. Ver docs/10.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    server {
        listen 8000;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        charset utf-8;

        # La cabecera `X-Forwarded-*` es la que permite que Laravel sepa el
        # protocolo y la direccion reales cuando va detras del proxy.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # `realpath` resuelve cualquier `..` en la ruta antes de pasarsela a
        # PHP. Sin esto, un `..` en la URL permite leer archivos del contenedor
        # que estan fuera de `public/`.
        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;

            include fastcgi_params;

            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT    $document_root;
            fastcgi_param  HTTPS            $https if_not_empty;

            # El tiempo maximo acota el trabajo que una peticion puede hacer
            # ocupar. Con los datos de salud, una peticion colgada es peor que
            # una peticion rechazada.
            fastcgi_read_timeout 60;
        }

        location ~ /\. {
            deny all;
        }
    }
}