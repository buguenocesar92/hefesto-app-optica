; =============================================================================
; supervisord de la API de OpticaHefesto.
; =============================================================================
;
; TRES PROCESOS, UN CONTENEDOR
; ---------------------------
;   - php-fpm:  ejecuta el codigo de Laravel.
;   - nginx:   sirve los archivos publicos y manda a php-fpm.
;   - worker:  corre la cola.
;
; TODOS LOS REGISTROS A STDERR Y STDOUT
; -------------------------------------
; Los tres escriben a `docker logs`. Un archivo de registro dentro del
; contenedor es una forma de que el registro se pierda en el proximo
; despliegue sin que nadie lo note.
;
; `autorestart=true` en los tres: un contenedor que se cae una vez y se queda
; caido es peor que uno que se levanta solo.
;
; QUE PASE SI EL WORKER MUERE
; ---------------------------
; Se levanta solo. Un contenedor con la API arriba y el worker caido acumula
; tareas sin ejecutar, y en una optica eso significa revisiones de vencimiento
; que no se hacen. El orquestador tambien tiene una politica de reinicio en
; `docker-compose.prod.yml`. Ver docs/04.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
; `autorestart=unexpected` y no `true`: si el comando de la cola sale con un
; codigo de exito, no tiene sentido volver a levantarlo en bucle.
autorestart=unexpected
exitcodes=0
priority=30
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0